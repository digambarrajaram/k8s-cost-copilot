apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server-sa
      containers:
        - name: mcp-server
          image: containers/kubernetes-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: MCP_TRANSPORT
              value: "http-chunked"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: mcp-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
