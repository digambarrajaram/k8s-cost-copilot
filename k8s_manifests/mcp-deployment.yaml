apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server-sa
      containers:
        - name: mcp-server
          image: docker.io/mcp/kubernetes:latest
          imagePullPolicy: Always
          args: ["sse"] 
          ports:
            - containerPort: 3000
          env:
            - name: MCP_TRANSPORT
              value: "http-chunked"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  namespace: default
  # Prometheus annotations allow the cross-namespace scraping engine to discover this endpoint
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: mcp-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
