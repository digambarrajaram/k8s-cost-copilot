apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: mcp-test
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: true
        uid: c32efcb8-7773-4a27-b2b9-9accf617d9a4
---
